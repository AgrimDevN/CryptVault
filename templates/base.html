<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}CryptVault{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-timeout="{{ timeout }}" {% if unlocked %}data-unlocked="1"{% endif %}>
<header class="topbar">
  <a class="brand" href="{{ url_for('index') }}"><span class="lock">&#128274;</span> CryptVault</a>
  {% if unlocked %}
  <nav>
    <a href="{{ url_for('vault') }}">Vault</a>
    <a href="{{ url_for('generator') }}">Generator</a>
    <a href="{{ url_for('audit') }}">Audit chain</a>
    <a href="{{ url_for('settings') }}">Settings</a>
    <form method="post" action="{{ url_for('logout') }}" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <button class="btn ghost">Lock &middot; {{ username }}</button>
    </form>
  </nav>
  {% endif %}
</header>
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
{% if unlocked %}<div class="timer" id="timer"></div>{% endif %}
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
